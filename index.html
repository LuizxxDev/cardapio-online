  if(!l){if(d>0)cart.push({id:id,q:1,ad:{},obs:""})}else{l.q+=d;if(l.q<=0)cart.splice(cart.indexOf(l),1)}

function closeOpt(){show($("mod"),false,"flex");lock()}
function optTotal(){var p=all[cur].p;for(var k in mad)p+=ADD[k].p*mad[k];return p*mq}

/* ---- extras: taxa, horário, memória, Pix, QR ---- */
function ST(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("fb_"+k));localStorage.setItem("fb_"+k,JSON.stringify(v))}catch(e){return null}}
function rnd(v){var u=CFG.arredondar||0.01;return Math.round(Math.ceil(v/u-1e-9)*u*100)/100}
function dist(){
  if(CFG.lojaLat==null||CFG.lojaLng==null||!loc)return null;
  var r=Math.PI/180,a1=(loc.lat-CFG.lojaLat)*r,a2=(loc.lng-CFG.lojaLng)*r,
  a=Math.sin(a1/2)*Math.sin(a1/2)+Math.cos(CFG.lojaLat*r)*Math.cos(loc.lat*r)*Math.sin(a2/2)*Math.sin(a2/2);
  return 2*6371*Math.asin(Math.sqrt(a));
}
function kmTxt(){var d=dist();return d===null?"":(d<1?Math.round(d*1000)+" m":d.toFixed(1).replace(".",",")+" km")}
function locLbl(){return CFG.lojaLat!=null?"Compartilhar minha localização":"Compartilhar localização GPS (opcional)"}
function fee(){
  if(tipo==="retirada")return 0;
  if(CFG.lojaLat!=null&&CFG.lojaLng!=null){var d=dist();if(d===null)return null;return d<CFG.gratisAteKm?0:rnd(d*CFG.porKm)}
  if(CFG.bairros.length){var b=CFG.bairros.filter(function(x){return x[0]===bairroSel})[0];return b?b[1]:null}
  return CFG.taxa;
}
function nowBelem(){var p={};new Intl.DateTimeFormat("en-US",{timeZone:"America/Belem",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return{d:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday],m:(+p.hour%24)*60+ +p.minute}}
function st(){
  var H=CFG.horarios;if(!H||!Object.keys(H).length)return{open:null};
  var n=nowBelem(),t=function(x){var a=x.split(":");return +a[0]*60+ +a[1]},td=H[n.d],pv=H[(n.d+6)%7];
  if(pv&&t(pv[1])<=t(pv[0])&&n.m<t(pv[1]))return{open:true,msg:"Aberto agora · até "+pv[1]};
  if(td){var o=t(td[0]),c=t(td[1]);
    if(c<=o?n.m>=o:(n.m>=o&&n.m<c))return{open:true,msg:"Aberto agora · até "+td[1]};
    if(n.m<o)return{open:false,msg:"Fechado · abrimos hoje às "+td[0]}}
  var nm=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
  for(var i=1;i<=7;i++){var dd=(n.d+i)%7;if(H[dd])return{open:false,msg:"Fechado · abrimos "+(i===1?"amanhã":nm[dd])+" às "+H[dd][0]}}
  return{open:false,msg:"Fechado no momento"};
}
function drawStatus(){var el=$("status"),x=st();if(x.open===null){show(el,false);return}
  el.className="border-b border-white/10 bg-neutral-950 px-3.5 py-2 text-center text-sm font-bold "+(x.open?"text-green-400":"text-red-400");el.textContent=x.msg}
function copyTxt(t,b){
  var ok=function(){var o=b.textContent;b.textContent="Copiado ✓";setTimeout(function(){b.textContent=o},1800)};
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}

   +'<button type="button" class="'+C.send+'" onclick="copyTxt(shareLink,this)">Copiar link</button>'

  var tp=CFG.retirada?'<div class="mt-3 grid grid-cols-2 gap-2"><label class="'+C.opt+'"><input type="radio" name="tp" value="entrega"'+(tipo==="entrega"?' checked':'')+' onchange="setTipo(this.value)">Entrega</label><label class="'+C.opt+'"><input type="radio" name="tp" value="retirada"'+(tipo==="retirada"?' checked':'')+' onchange="setTipo(this.value)">Retirar no balcão</label></div>':'';
  var ad2=tipo==="retirada"?'<p class="mt-3 text-sm text-neutral-300">Você retira o pedido na loja, sem taxa de entrega.</p>':f("rua","Rua / Avenida","text",'autocomplete="address-line1" autocapitalize="words"')+'<div class="grid grid-cols-2 gap-2.5">'+f("num","Número","text",'inputmode="numeric" maxlength="6" placeholder="Ex.: 123" oninput="mask(this,2)"')+bf+'</div>'+f("ref","Complemento / Ponto de referência")
   +'<button id="locBtn" class="mt-4 '+(loc?C.loc1:C.loc0)+'" onclick="getLoc()">'+(loc?'Localização compartilhada ✓':locLbl())+'</button><small class="'+C.sm+' mt-1.5">'+(CFG.lojaLat!=null?"Usamos sua localização para calcular a taxa pela distância (grátis até "+Math.round(CFG.gratisAteKm*1000)+" m, depois R$ "+String(CFG.porKm).replace(".",",")+" por km) e para o entregador chegar até você.":"Ajuda o entregador a achar você mais rápido. Se preferir, só o endereço já basta.")+'</small>';
  h+=sec(3,CFG.retirada?"Entrega ou retirada":"Endereço de entrega",tp+ad2);
  var po="";["Pix","Cartão de crédito","Cartão de débito","Dinheiro"].forEach(function(p){
    po+='<label class="'+C.opt+'"><input type="radio" name="pay" value="'+p+'"'+(pay===p?' checked':'')+' onchange="setPay(this.value)">'+p+'</label>'});
  h+=sec(4,"Forma de pagamento",'<div class="mt-3 grid grid-cols-2 gap-2">'+po+'</div>'+(CFG.pix?'<div id="pixBox" class="'+(pay==="Pix"?'':'hidden')+' mt-3 rounded-lg bg-neutral-800 p-3 ring-1 ring-white/10"><p class="text-sm text-neutral-400">Chave Pix (celular) · copie e pague no app do seu banco</p><p class="break-all font-extrabold">'+esc(CFG.pix)+'</p><button type="button" class="'+C.add+' mt-2" onclick="copyTxt(CFG.pix,this)">Copiar chave</button></div>':'')+'<div id="trocoBox" class="'+(pay==="Dinheiro"?'':'hidden')+'"><div class="'+C.lab+'">Precisa de troco?</div><div class="mt-1 grid grid-cols-2 gap-2">'
   +'<label class="'+C.opt+'"><input type="radio" name="tr" value="sim"'+(troco==="sim"?' checked':'')+' onchange="setTroco(this.value)">Sim</label>'
   +'<label class="'+C.opt+'"><input type="radio" name="tr" value="nao"'+(troco==="nao"?' checked':'')+' onchange="setTroco(this.value)">Não</label></div>'
   +'<div id="trocoVal" class="'+(troco==="sim"?'':'hidden')+'">'+f("trocoPara","Troco para quanto?","text",'inputmode="numeric" placeholder="R$ 0,00" oninput="mask(this,3)"')+'</div></div>');
  var t=function(a,b,c){return '<div class="flex justify-between py-1 '+(c||"text-neutral-300")+'"><span>'+a+'</span><span>'+b+'</span></div>'};
  h+=sec(5,"Resumo",'<div class="mt-2">'+t("Subtotal",R(sub()))+t(tipo==="retirada"?"Retirada no balcão":"Taxa de entrega"+(dist()!==null?" ("+kmTxt()+")":""),fee()===null?(CFG.lojaLat!=null?"compartilhe a localização":"escolha o bairro"):(fee()===0?"Grátis":R(fee())))+t("Total",R(sub()+(fee()||0)),"mt-1.5 border-t border-white/15 pt-3 text-2xl font-extrabold text-white")+'</div>');
  if(CFG.bloquearFechado&&st().open===false)h+='<p class="mt-3 text-center font-bold text-red-400">'+st().msg+'. Você pode montar o pedido, mas o envio só é liberado quando a loja abrir.</p>';
  h+='<p class="mt-4 text-center text-sm text-neutral-400">O WhatsApp vai abrir com o pedido pronto. Toque em enviar na conversa para a loja receber.</p>';
  var pf='<div class="min-h-[1em] pb-2 text-center text-sm font-extrabold text-red-400" id="err" role="alert"></div><div class="flex items-center gap-3"><div class="shrink-0"><div class="text-xs text-neutral-400">Total</div><div class="text-xl font-extrabold">'+R(sub()+(fee()||0))+'</div></div><button class="flex-1 rounded-xl bg-green-600 py-3.5 text-base font-extrabold text-white active:scale-[.98]" onclick="sendOrder()">Enviar pelo WhatsApp</button></div>';
  var keep=snap();if(!pre){pre=true;var sc=ST("cli")||{};["nome","tel","rua","num","bai","ref"].forEach(function(k){if(!keep[k]&&sc[k])keep[k]=sc[k]})}$("pb").innerHTML=h;restore(keep);$("pf").innerHTML=pf;show($("pf"),true);
}
function snap(){var o={};["obs","nome","tel","rua","num","bai","ref","trocoPara"].forEach(function(i){var e=$(i);if(e)o[i]=e.value});return o}
function restore(o){for(var i in o){var e=$(i);if(e)e.value=o[i]}}
function setPay(v){pay=v;show($("trocoBox"),v==="Dinheiro");if($("pixBox"))show($("pixBox"),v==="Pix")}
function setTroco(v){troco=v;show($("trocoVal"),v==="sim")}
function mask(el,t){
  var d=el.value.replace(/\D/g,"");
  if(t===1){d=d.slice(0,11);var s=d;
    if(d.length>10)s="("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
    else if(d.length>6)s="("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);
    else if(d.length>2)s="("+d.slice(0,2)+") "+d.slice(2);
    else if(d.length)s="("+d;
    el.value=s}
  else if(t===2)el.value=d.slice(0,6);
  else{d=d.slice(0,7);el.value=d?R(parseInt(d,10)/100):""}
}
function getLoc(){
  var b=$("locBtn"),e=$("err");
  if(!navigator.geolocation){e.textContent="Localização indisponível neste aparelho. Pode seguir só com o endereço.";return}
  b.textContent="Obtendo localização…";
  navigator.geolocation.getCurrentPosition(function(p){
    loc={lat:p.coords.latitude,lng:p.coords.longitude};b.className="mt-4 "+C.loc1;b.textContent="Localização compartilhada ✓";e.textContent="";fill();
  },function(){
    loc=null;b.className="mt-4 "+C.loc0;b.textContent=locLbl();
    e.textContent="Não foi possível obter a localização. Você pode continuar só com o endereço.";
  },{enableHighAccuracy:true,timeout:15000});
}
function sendOrder(){
  var v=function(i){return ($(i).value||"").trim()},e=$("err"),tot=sub()+(fee()||0);
  var ent=tipo==="entrega";
  if(CFG.bloquearFechado&&st().open===false){e.textContent=st().msg+". O envio é liberado quando a loja abrir.";return}
  if(!v("nome")||!v("tel")||(ent&&(!v("rua")||!v("num")||!v("bai")))){e.textContent=ent?"Preencha nome, telefone, rua, número e bairro.":"Preencha nome e telefone.";return}
  if(ent&&fee()===null){e.textContent=CFG.lojaLat!=null?"Compartilhe sua localização para calcular a taxa de entrega.":"Escolha o bairro de entrega.";return}
  if(v("tel").replace(/\D/g,"").length<10){e.textContent="Digite o telefone com DDD, ex.: (91) 99999-9999.";return}
  var tp=0;
  if(pay==="Dinheiro"&&troco==="sim"){tp=parseInt(v("trocoPara").replace(/\D/g,"")||"0",10)/100;
    if(!tp||tp<tot){e.textContent="O valor do troco deve ser igual ou maior que "+R(tot)+".";return}}
  var id=Math.floor(1000+Math.random()*9000);
  var maps=loc?"https://www.google.com/maps?q="+loc.lat+","+loc.lng:"";
  var gps=loc?"\n\n🗺️ *Localização no mapa:*\n"+maps+"\n(GPS: "+loc.lat.toFixed(6)+", "+loc.lng.toFixed(6)+")":"\n\n🗺️ Localização GPS: não compartilhada";
  var itens="";cart.forEach(function(l){var ex=exList(l);
    itens+="• "+l.q+"x "+all[l.id].n+(ex.length?" (+ "+ex.join(", ")+")":"")+" – "+R(unit(l)*l.q)+"\n"+(l.obs?"   Obs: "+l.obs+"\n":"")});
  var end=ent?v("rua")+", "+v("num")+" – "+v("bai")+(v("ref")?" ("+v("ref")+")":""):"";
  var pg=pay;if(pay==="Dinheiro")pg+=troco==="sim"?" – troco para "+R(tp)+" (levar "+R(tp-tot)+")":" – não precisa de troco";
  var m1="🍔 *NOVO PEDIDO #"+id+" – Fabi Burguer*\n\n👤 "+v("nome")+"\n📞 "+v("tel")+"\n\n*Itens:*\n"+itens
   +(v("obs")?"\n📝 Obs: "+v("obs")+"\n":"")+"\nSubtotal: "+R(sub())+"\n"+(ent?"Entrega"+(dist()!==null?" ("+kmTxt()+")":bairroSel?" ("+bairroSel+")":""):"Retirada no balcão")+": "+(fee()===0?"Grátis":R(fee()||0))+"\n*Total: "+R(tot)+"*\n\n💳 Pagamento: "+pg
   +"\n\n"+(ent?"📍 Endereço: "+end+gps:"🏪 *RETIRADA NO BALCÃO*");
  var m2="🛵 *ENTREGA – Pedido #"+id+"*\n\n👤 "+v("nome")+"\n📞 "+v("tel")+"\n📍 "+end+gps
   +"\n\n💳 "+pg+"\n💰 Valor a receber: "+(pay==="Dinheiro"||pay.indexOf("Cartão")===0?R(tot):"Pago via Pix – confirmar com a loja");
  lastOrder={id:id,m2:m2,ent:ent,pay:pay};
  var sv=ST("cli")||{};sv.nome=v("nome");sv.tel=v("tel");sv.tipo=tipo;if(ent){sv.rua=v("rua");sv.num=v("num");sv.bai=v("bai");sv.ref=v("ref");sv.bairro=bairroSel}ST("cli",sv);
  window.open("https://wa.me/"+CFG.loja+"?text="+encodeURIComponent(m1),"_blank");
  doneScreen();
}
function doneScreen(){
  $("panel").innerHTML=hd("Falta só um passo","closeCart()")+'<div class="'+C.pb+' text-center"><h3 class="mt-6 font-display text-2xl">Pedido #'+lastOrder.id+' pronto</h3>'
   +'<p class="mt-3 text-neutral-300">Abrimos o WhatsApp com seu pedido. <b class="text-white">Toque em enviar na conversa</b> para a Fabi Burguer receber. Sem esse envio, a loja não recebe o pedido.</p>'
   +pixBox()+'<a class="'+C.send+' block" href="https://wa.me/'+CFG.loja+'" target="_blank">Abrir WhatsApp da loja</a>'
   +(CFG.entregador&&lastOrder.ent?'<button class="mt-3 w-full rounded-xl bg-neutral-800 py-3 font-extrabold" onclick="sendCourier()">Enviar localização ao entregador</button>':'')
   +'<button class="mt-3 w-full rounded-xl bg-neutral-800 py-3 font-extrabold" onclick="newOrder()">Fazer novo pedido</button></div>';
}
function sendCourier(){window.open("https://wa.me/"+CFG.entregador+"?text="+encodeURIComponent(lastOrder.m2),"_blank")}
function newOrder(){cart=[];loc=null;drawMenu();drawDest();bar();closeCart()}
(function(){var c=ST("cart");if(Array.isArray(c))cart=c.filter(function(l){if(!l||!all[l.id]||!(l.q>0))return false;l.ad=l.ad||{};for(var k in l.ad)if(!ADD[k])return false;return true});
  var cl=ST("cli");if(cl){if(cl.tipo==="retirada"&&CFG.retirada)tipo="retirada";if(cl.bairro&&CFG.bairros.some(function(b){return b[0]===cl.bairro}))bairroSel=cl.bairro}})();
drawMenu();drawDest();bar();drawStatus();setInterval(drawStatus,60000);
</script>
</body>
</html>
